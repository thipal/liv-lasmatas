header.band h1,header.band .sub,header.band .eyebrow{text-shadow:0 1px 3px rgba(0,0,0,.55)}
header.band nav.tabs{background:color-mix(in srgb,var(--band) 55%,transparent);margin-inline:-10px;padding-inline:6px;border-radius:8px 8px 0 0}
header.band .wrap{padding-block:40px 0;display:flex;flex-direction:column;gap:18px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--flag)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,52px);line-height:1;margin:4px 0 0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sub{color:color-mix(in srgb,var(--band-ink) 72%,transparent);margin:6px 0 0;font-size:14px}
.highlights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:color-mix(in srgb,var(--band-ink) 18%,transparent);border-radius:8px;overflow:hidden}
.hl{background:color-mix(in srgb,var(--band) 72%,transparent);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);padding:12px 14px;min-width:0}
.hl .k{font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:color-mix(in srgb,var(--band-ink) 65%,transparent)}
.hl .v{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl .n{font-family:var(--display);font-size:26px;font-weight:700;color:var(--flag);line-height:1.1;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{font-family:var(--display);font-size:17px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:none;border:0;color:color-mix(in srgb,var(--band-ink) 70%,transparent);padding:10px 14px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--band-ink);border-bottom-color:var(--flag)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
main .wrap{padding-block:24px 48px;display:flex;flex-direction:column;gap:22px}
.notice{background:color-mix(in srgb,var(--flag) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--flag) 45%,transparent);border-radius:8px;padding:10px 14px;font-size:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
h2{font-family:var(--display);font-size:24px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0;line-height:1.1}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:0}
.board{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:13px;color:var(--muted);text-align:right;padding:10px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th.l,td.l{text-align:left}
td.pos{font-family:var(--display);font-weight:700;font-size:18px;width:44px;text-align:left;color:var(--muted)}
tr.top td.pos{color:var(--green)}
td.total{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink)}
.sticky{position:sticky;left:0;background:var(--surface);z-index:1}
.sticky2{position:sticky;left:44px;background:var(--surface);z-index:1;box-shadow:1px 0 0 var(--line)}
th.rd{font-size:12px;letter-spacing:.04em}
td.rd{color:var(--ink);min-width:44px}
td.rd.miss{color:var(--line)}
td.rd.best{font-weight:700;color:var(--green)}
td.rd small.stb{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.1}
.name{font-weight:600}
.logo{width:22px;height:22px;object-fit:contain;flex:none;display:block}
.chip.solid .logo{width:26px;height:26px;margin:-3px 0 -3px -5px}
.team h3 .logo{width:52px;height:52px}
legend .logo{width:24px;height:24px}
.crests{display:flex;gap:10px;flex-wrap:wrap}
.crests img{width:clamp(48px,10vw,68px);height:clamp(48px,10vw,68px);object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.cap{display:inline-block;margin-left:6px;font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:.06em;line-height:1;padding:2px 5px 1px;border-radius:4px;background:var(--flag);color:var(--flag-ink);vertical-align:2px}
tr.mid td{background:color-mix(in srgb,var(--flag) 16%,var(--surface))}
.prize{background:var(--surface);border:1px solid color-mix(in srgb,var(--flag) 55%,var(--line));border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.prize .k{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:14px;color:var(--flag-ink);background:var(--flag);padding:2px 8px;border-radius:4px}
.prize .w{font-weight:600}
.guest-row{display:flex;gap:8px;align-items:center}
.guest-row input[type=text]{flex:1;min-width:0}
.guest-row input[type=number]{width:64px}
svg .slice:hover{opacity:.82}
td.rd.short{color:var(--muted);font-style:italic}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--muted))}
.chip.solid{background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);padding:2px 9px;border-radius:999px;font-weight:500}
.team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.team{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.team h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.team .tt{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--green)}
.team ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.team li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.team li span:last-child{color:var(--muted)}
.rounds{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rounds button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer;text-align:left;font-family:var(--body)}
.rounds button .d{font-family:var(--display);font-weight:700;font-size:17px;display:block;line-height:1.1}
.rounds button .c{font-size:12px;color:var(--muted)}
.rounds button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.rounds button[aria-pressed="true"] .c{color:color-mix(in srgb,var(--bg) 80%,transparent)}
.two{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.absent{color:var(--muted);font-size:14px}
.btn{font-family:var(--body);font-weight:600;font-size:14px;border-radius:8px;padding:8px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--bg)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
input,select{font-family:var(--body);font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input[type=number]{width:72px;text-align:right;font-variant-numeric:tabular-nums}
.entry{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.entry fieldset{border:1px solid var(--line);border-radius:8px;margin:0;padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.entry legend{padding:0 6px;font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:14px;display:flex;align-items:center;gap:6px}
.entry .p{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.entry .pair{display:flex;gap:6px;flex:none}
.entry .pair input{width:64px}
.entry .p.hint .pair span{width:64px;text-align:center;font-size:12px}
.entry .p>span:first-child{min-width:0;line-height:1.25}
.list{display:flex;flex-direction:column}
.list .it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.list .it:first-child{border-top:0}
.list .it .grow{flex:1;min-width:140px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.status{font-size:14px;min-height:1.4em}
.status.err{color:var(--danger)}
.status.ok{color:var(--green)}
.empty{padding:28px;text-align:center;color:var(--muted)}
footer{color:var(--muted);font-size:12px;text-align:center;padding-block:0 32px}
@media (max-width:720px){.two{grid-template-columns:1fr}.highlights{grid-template-columns:1fr}.hl{display:flex;align-items:baseline;gap:10px}.hl .k{flex:none;width:96px}.hl .v{flex:1}.hl .n{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.board,.team,.panel{animation:rise .25s ease-out both}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script id="app-script">
(function(){
"use strict";
var S = JSON.parse(document.getElementById("league-data").textContent);
var ui = {tab:"ligue", round:null, canEdit:false, editId:null, confirm:null, status:"", statusKind:"", busy:false};
try{ var t = localStorage.getItem("ligue-tab"); if(t) ui.tab = t; var md = localStorage.getItem("ligue-mode"); if(md) ui.mode = md; }catch(e){}
if(location.hash && /^#(ligue|equipes|tournois|gerer)$/.test(location.hash)) ui.tab = location.hash.slice(1);

var MOIS = ["ene.","feb.","mar.","abr.","may.","jun.","jul.","ago.","sept.","oct.","nov.","dic."];
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pd(d){var p=d.split("-");return {y:+p[0],m:+p[1]-1,d:+p[2]};}
function shortDate(d){var x=pd(d);return x.d+"/"+String(x.m+1).padStart(2,"0");}
function longDate(d){var x=pd(d);return "dom. "+x.d+" "+MOIS[x.m]+" "+x.y;}
function team(id){for(var i=0;i<S.teams.length;i++) if(S.teams[i].id===id) return S.teams[i]; return {id:"",name:"Sin equipo",color:"#888"};}
function player(id){for(var i=0;i<S.players.length;i++) if(S.players[i].id===id) return S.players[i]; return null;}
function rounds(){return S.tournaments.slice().sort(function(a,b){return a.date<b.date?-1:1;});}
function f1(n){return (Math.round(n*10)/10).toFixed(1).replace(".",",");}
function r1(n){return Math.round(n*10)/10;}
function minP(){return Math.max(1,S.minPlayers||1);}
function capTag(pid){var p=player(pid);if(!p)return '';var t=team(p.team);return t.captain===pid?'<span class="cap" title="Capitán">C</span>':'';}
var GUEST={id:"",name:"Invitado",color:"#8A948D"};
function gkey(name){return "g:"+String(name).trim().toLowerCase();}
/* All of a tournament's cards, league players and guests together.
   Equal scores stay tied (T5) until a putting-green playoff order is stored for the whole group in r.tb (1 = won). */
function dayRows(r){
  var tb=r.tb||{};
  var rows=Object.keys(r.scores).map(function(k){var p=player(k);return {id:k,name:p?p.name:"(jugador eliminado)",team:p?p.team:"",pts:r.scores[k],guest:false,tb:tb[k],gross:(r.gross||{})[k]};});
  (r.guests||[]).forEach(function(g){var k=gkey(g.name);rows.push({id:k,name:g.name,team:"",pts:g.pts,guest:true,tb:tb[k],gross:g.gross});});
  rows.sort(function(a,b){return b.pts-a.pts||(a.tb||999)-(b.tb||999)||a.name.localeCompare(b.name,"es");});
  placeGroups(rows,function(x,pos,tie){x.pos=pos;x.posLabel=(tie?"T":"")+pos;x.tie=tie;});
  return rows;
}
/* Walk rows (sorted by score) in groups of equal score; a group is split only when its playoff is complete */
function placeGroups(rows,fn){
  var i=0;
  while(i<rows.length){
    var j=i; while(j<rows.length&&rows[j].pts===rows[i].pts&&rows[j].sk===rows[i].sk) j++;
    var g=rows.slice(i,j), ok=settled(g);
    g.forEach(function(x,k){fn(x,ok?i+k+1:i+1,!ok&&g.length>1,ok?null:{from:i+1,to:j});});
    i=j;
  }
}
/* League points for one tournament, league members only (guests left out), N = members who played:
   place p earns N-p+1 and the winner gets +2. Players still tied share the average of the places they cover. */
/* Scratch: members' gross Stableford; players on the same gross share the points of the places they cover (two tied 2nd share places 2 and 3, the next takes place 4) */
function scrRows(r){
  var g=r.gross||{};
  var rows=Object.keys(g).filter(function(k){return typeof g[k]==="number";}).map(function(k){var p=player(k);return {id:k,name:p?p.name:"(jugador eliminado)",team:p?p.team:"",pts:g[k],net:r.scores[k],guest:false};});
  rows.sort(function(a,b){return b.pts-a.pts||a.name.localeCompare(b.name,"es");});
  placeGroups(rows,function(x,pos,tie){x.pos=pos;x.posLabel=(tie?"T":"")+pos;x.tie=tie;});
  return rows;
}
function hcOf(p){var v=p&&Number(p.hc);return p&&p.hc!==""&&p.hc!=null&&isFinite(v)?v:99;}
function scrPts(r){return placePts(scrRows(r));}
function ligaPts(r){return placePts(dayRows(r).filter(function(x){return !x.guest;}));}
/* Same scale for both rankings: place p of N earns N-p+1, winner +2, unresolved ties share the average */
function placePts(rows){
  var N=rows.length, out={};
  function val(p){return N-p+1+(p===1?2:0);}
  placeGroups(rows,function(x,pos,tie,span){
    if(!span||span.from===span.to){out[x.id]=val(pos);return;}
    var s=0; for(var p=span.from;p<=span.to;p++) s+=val(p);
    out[x.id]=s/(span.to-span.from+1);
  });
  return out;
}
function nfmt(n){return Math.round(n)===n?String(n):f1(n);}
function inaug(t){return Number(t&&t.inaugural)||0;}
function group(rows,pts){return rows.filter(function(x){return x.pts===pts;});}
function settled(g){return g.length<2||g.every(function(x){return x.tb;});}
/* Middle prize: slot n/2 counting guests (16 -> 8th, 15 -> 7th). A guest there is skipped and
   the nearest league member above wins. Equal scores need the putting-green playoff first. */
/* Burbuja: slot n/2 counting guests. Equal net scores go by the putting-green playoff when it is complete.
   With no playoff, the tie is decided by handicap: the league member with the HIGHEST handicap in the tied group wins.
   A guest at the slot is skipped and the nearest league member above wins (same tie rule for his group). */
function hcPick(g){
  var mem=g.filter(function(x){return !x.guest;}); if(!mem.length) return null;
  var hs=mem.map(function(x){return hcOf(player(x.id));}).filter(function(v){return v<99;});
  if(hs.length<mem.length) return {pending:g};
  var top=Math.max.apply(null,hs), best=mem.filter(function(x){return hcOf(player(x.id))===top;});
  if(best.length>1) return {pending:best};
  return {win:best[0]};
}
function midPrize(rows){
  var n=rows.length; if(n<2) return null;
  var k=Math.floor(n/2), x=rows[k-1], g=group(rows,x.pts);
  function viaHc(grp,skipped){var r=hcPick(grp); if(!r) return null; if(r.pending) return {k:k,n:n,pending:r.pending,skipped:skipped}; return {k:k,n:n,win:r.win,wpos:k,skipped:skipped,byHc:true,tie:grp};}
  if(g.length>1&&!settled(g)){var a=viaHc(g,[]); if(a) return a;}
  var j=k-1, skipped=[];
  while(j>=0&&rows[j].guest){skipped.push(rows[j]);j--;}
  if(j<0) return {k:k,n:n,none:true};
  var g2=group(rows,rows[j].pts);
  if(g2.length>1&&!settled(g2)){var b=viaHc(g2,skipped); if(b) return b;}
  return {k:k,n:n,win:rows[j],wpos:j+1,skipped:skipped};
}
function logoOf(t){return t&&(t.logo||(t.id&&team(t.id).logo))||"";}
function mark(t){var l=logoOf(t);return l?'<img class="logo" src="'+esc(l)+'" alt="">':'<span class="dot" style="--c:'+esc(t.color)+'"></span>';}
function chip(t,solid){return '<span class="chip'+(solid?' solid':'')+'" style="--c:'+esc(t.color)+'">'+mark(t)+esc(t.name)+'</span>';}

/* Golf leaderboard ranking: equal totals share a position, shown as T3 */
function rank(rows,key){
  rows.sort(function(a,b){return b[key]-a[key] || a.name.localeCompare(b.name,"es");});
  var n=rows.length;
  rows.forEach(function(r,i){
    var first=i; while(first>0 && rows[first-1][key]===r[key]) first--;
    var tied=(i>0&&rows[i-1][key]===r[key])||(i<n-1&&rows[i+1][key]===r[key]);
    r.pos=first+1; r.posLabel=(tied?"T":"")+(first+1);
  });
  return rows;
}
function league(){
  var rs=rounds();
  var LP=rs.map(function(r){var m=ligaPts(r),best=0;for(var k in m) if(m[k]>best) best=m[k];m.__win=best;return m;});
  var SP=rs.map(function(r){var m=scrPts(r),best=0;for(var k in m) if(m[k]>best) best=m[k];m.__win=best;return m;});
  var rows=S.players.map(function(p){
    var stb=0,n=0,lp=0,per=[],ini=inaug(team(p.team));
    rs.forEach(function(r,i){var v=r.scores[p.id]; if(typeof v==="number"){stb+=v;n++; var q=LP[i][p.id]; lp+=q; per.push({s:v,p:q,win:q===LP[i].__win});} else per.push(null);});
    var sp=0,sn=0,gs=0,sper=[];
    rs.forEach(function(r,i){var g=(r.gross||{})[p.id]; if(typeof g==="number"){var q=SP[i][p.id]; sp+=q; sn++; gs+=g; sper.push({s:g,p:q,win:q===SP[i].__win});} else sper.push(null);});
    return {id:p.id,name:p.name,team:p.team,ini:ini,total:r1(ini+lp),played:n,avg:n?stb/n:0,per:per,scr:{total:r1(sp),played:sn,avg:sn?gs/sn:0,per:sper}};
  });
  return rank(rows,"total");
}
function teamTable(){
  var rs=rounds();
  var rows=S.teams.map(function(t){
    var mem=S.players.filter(function(p){return p.team===t.id;});
    /* team points for a tournament = average of the members who played that day */
    var per=rs.map(function(r){var s=0,c=0; mem.forEach(function(p){var v=r.scores[p.id]; if(typeof v==="number"){s+=v;c++;}}); return {s:c>=minP()?s/c:0,c:c};});
    var tot=r1(per.reduce(function(a,x){return a+x.s;},0)), cards=per.reduce(function(a,x){return a+x.c;},0);
    tot=r1(tot+inaug(t));
    return {id:t.id,name:t.name,color:t.color,ini:inaug(t),total:tot,cards:cards,per:per,members:mem};
  });
  return rank(rows,"total");
}

function render(){
  var rs=rounds();
  if(!ui.round || !rs.some(function(r){return r.id===ui.round;})) ui.round = rs.length?rs[rs.length-1].id:null;
  var L=league(), last=rs[rs.length-1];
  var leader=L[0]&&L[0].played?L[0]:null;

/* Puttmaster: in each completed putting-green playoff (a net tie whose order is stored in r.tb),
   a league member earns 1 point per opponent finishing behind him (4-way tie: winner 3, second 2, third 1). */
function puttTally(rs){
  var t={};
  rs.forEach(function(r){
    var rows=dayRows(r), seen={};
    rows.forEach(function(x){
      if(seen[x.pts]) return; seen[x.pts]=1;
      var g=group(rows,x.pts); if(g.length<2||!settled(g)) return;
      g.forEach(function(y){
        if(y.guest) return;
        var beat=g.filter(function(z){return z.tb>y.tb;}).length;
        if(!t[y.id]) t[y.id]={id:y.id,name:y.name,team:y.team,total:0,played:0,per:{}};
        t[y.id].total+=beat; t[y.id].played++; t[y.id].per[r.id]=(t[y.id].per[r.id]||0)+beat;
      });
    });
  });
  return t;
}

var HB="host:claude_browser", RFEG="https://rfegolf.es/consulta-handicap/";

function txt(res){try{return (res.content||[]).filter(function(c){return c.type==="text";}).map(function(c){return c.text;}).join("\n")||(typeof res.payload==="string"?res.payload:JSON.stringify(res.payload||""));}catch(e){return "";}}
function hcError(e){
  var c=e&&e.code;
  if(c==="server_not_connected") return "El navegador de la aplicación Claude no está disponible aquí. Abre esta página en la aplicación de escritorio de Claude e inténtalo de nuevo.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="not_granted") return "No se ha autorizado a esta página a usar el navegador de la aplicación Claude.";
  if(c==="cancelled") return "Has cancelado una acción del navegador. No se ha cambiado nada.";
  if(c==="capability_disabled"||c==="capability_removed") return "Esta vista no permite usar el navegador. Abre la página en la aplicación de escritorio de Claude.";

function parseHc(text,lic){
  var i=text.toUpperCase().indexOf(lic.toUpperCase()); if(i<0) return null;
  var m=/HCP actualizado:[^\n]*\n\s*(\+?-?\d+(?:[.,]\d+)?)/.exec(text.slice(i));
  if(!m) return null; var s=m[1].replace(",","."); return s.charAt(0)==="+"?-Number(s.slice(1)):Number(s);
}
async function refreshHc(){
  if(ui.hc&&ui.hc.running) return;
  var list=S.players.filter(function(p){return p.lic;});
  ui.hc={running:true,done:0,total:list.length,res:[],msg:"Abriendo la consulta de la RFEG…"}; render();
  try{
    var mcp=window.claude&&window.claude.use?await window.claude.use("mcp"):null;
    if(!mcp) throw {code:"capability_disabled"};
    var o=txt(await mcp.callTool(HB,"preview_start",{url:RFEG}));
    var tm=/tabId\s+([^\s)]+)/.exec(o), tab=tm?tm[1]:undefined;
    await sleep(2500);
    var ref=null;
    for(var t=0;t<3&&!ref;t++){var f=txt(await mcp.callTool(HB,"find",tab?{query:"Busca por nombre o licencia",tabId:tab}:{query:"Busca por nombre o licencia"}));var rm=/\[(ref_\d+)\]/.exec(f);ref=rm?rm[1]:null;if(!ref)await sleep(2000);}
    if(!ref) throw {code:"tool_error",message:"no se encontró el buscador de la RFEG"};
    for(var k=0;k<list.length;k++){
      var p=list[k]; ui.hc.msg="Consultando "+p.name+"…"; render();
      var base=tab?{tabId:tab}:{};
      await mcp.callTool(HB,"computer",Object.assign({action:"triple_click",ref:ref,action_summary:"Selects the text in the handicap search box"},base));
      await mcp.callTool(HB,"computer",Object.assign({action:"type",text:p.lic,action_summary:"Types a licence number into the handicap search"},base));
      var v=null;
      for(var a=0;a<4&&v===null;a++){await sleep(2500);v=parseHc(txt(await mcp.callTool(HB,"get_page_text",Object.assign({max_chars:2500},base))),p.lic);}

}

document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="f-round"){
    var date=document.getElementById("rd-date").value; if(!date) return setStatus("Indica la fecha del torneo.","err");
    var scores={},bad=false;
    document.querySelectorAll("[data-pid]").forEach(function(i){var v=i.value.trim(); if(v==="") return; var n=Number(v); if(!isFinite(n)||n<0||n>72||Math.round(n)!==n) bad=true; else scores[i.dataset.pid]=n;});
    var gross={},gbad2="";
    document.querySelectorAll("[data-gid]").forEach(function(i){var v=i.value.trim(); if(v==="") return; var n=Number(v),pid=i.dataset.gid,nm=(player(pid)||{}).name; if(!isFinite(n)||n<0||n>72||Math.round(n)!==n) gbad2="El bruto de "+nm+" no es válido (número entero de 0 a 72)."; else if(typeof scores[pid]!=="number") gbad2=nm+" tiene bruto pero no neto: introduce también el neto."; else if(n>scores[pid]) gbad2="El bruto de "+nm+" ("+n+") es mayor que su neto ("+scores[pid]+"): revisa los dos."; else gross[pid]=n;});
    if(bad) return setStatus("Un resultado no es válido: introduce un número entero de puntos Stableford (de 0 a 72).","err");
    var guests=[],gbad="";
    document.querySelectorAll("#guest-rows .guest-row").forEach(function(row){var nm=row.querySelector(".g-name").value.trim(),v=row.querySelector(".g-pts").value.trim(), gv=row.querySelector(".g-gross").value.trim(), gn=Number(gv); if(!nm&&!v) return; var n=Number(v); if(!nm) gbad="Falta el nombre de un invitado."; else if(v===""||!isFinite(n)||n<0||n>72||Math.round(n)!==n) gbad="Los puntos del invitado "+nm+" no son válidos (número entero de 0 a 72)."; else if(gv!==""&&(!isFinite(gn)||gn<0||gn>n||Math.round(gn)!==gn)) gbad="El bruto del invitado "+nm+" no es válido (entero, no mayor que su neto)."; else guests.push(gv===""?{name:nm,pts:n}:{name:nm,pts:n,gross:gn});});
    if(gbad) return setStatus(gbad,"err");
    if(gbad2) return setStatus(gbad2,"err");
    if(!Object.keys(scores).length) return setStatus("Introduce al menos un resultado.","err");
    var n=clone(), course=document.getElementById("rd-course").value.trim();
    var dup=n.tournaments.filter(function(r){return r.date===date&&r.id!==ui.editId;})[0];
    if(dup) return setStatus("Ya existe un torneo en esa fecha. Modifícalo desde la lista de abajo.","err");
    if(ui.editId){n.tournaments.forEach(function(r){if(r.id===ui.editId){if(JSON.stringify(r.scores)!==JSON.stringify(scores)||JSON.stringify(r.guests||[])!==JSON.stringify(guests)) delete r.tb; if(JSON.stringify(r.gross||{})!==JSON.stringify(gross)) delete r.tbg; r.date=date;r.course=course;r.scores=scores;r.guests=guests;r.gross=gross;}});}
    else n.tournaments.push({id:uid("r"),date:date,course:course,scores:scores,guests:guests,gross:gross});
    var wasEdit=!!ui.editId; ui.round=null;
    save(n,wasEdit?"Torneo modificado.":"Torneo del "+shortDate(date)+" guardado.");
  } else if(e.target.id==="f-roster"){
    var m=clone();
    m.season=document.getElementById("season").value.trim()||m.season;
    m.teams.forEach(function(t){var i=document.getElementById("tn-"+t.id); if(i&&i.value.trim()) t.name=i.value.trim(); var c=document.getElementById("tc-"+t.id); if(c) t.captain=c.value||null; var ii=document.getElementById("ti-"+t.id); if(ii&&ii.value.trim()!==""&&isFinite(Number(ii.value))) t.inaugural=Number(ii.value);});
    m.players.forEach(function(p){var i=document.getElementById("pn-"+p.id),s=document.getElementById("pt-"+p.id); if(i&&i.value.trim()) p.name=i.value.trim(); if(s) p.team=s.value; var li=document.getElementById("pl-"+p.id); if(li){var lv=li.value.trim().toUpperCase(); if(lv) p.lic=lv; else delete p.lic;} var hi=document.getElementById("ph-"+p.id); if(hi){var hv=hi.value.trim(); if(hv==="") delete p.hc; else if(isFinite(Number(hv))) p.hc=Number(hv);}});
    var np=document.getElementById("new-player").value.trim();
    if(np) m.players.push({id:uid("p"),name:np,team:document.getElementById("new-team").value});
    save(m,"Equipos y jugadores guardados.");
  }
});
